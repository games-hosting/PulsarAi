<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulsar AI - Login</title>

    <!-- Firebase CDN scripts (compat mode for static HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* Star canvas */
        #stars-canvas {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Arc lines */
        .arc-lines {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }
        .arc-lines svg {
            width: 100%;
            height: 100%;
        }

        /* Perspective grid floor */
        .grid-floor {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200%;
            height: 55%;
            z-index: 2;
            pointer-events: none;
        }
        .grid-floor svg {
            width: 100%;
            height: 100%;
        }

        /* Login box */
        .box {
            position: relative;
            z-index: 3;
            background: rgba(10, 10, 20, 0.75);
            padding: 50px 60px;
            border-radius: 16px;
            border: 1px solid rgba(106, 79, 255, 0.25);
            box-shadow: 0 0 60px rgba(106, 79, 255, 0.15), inset 0 0 40px rgba(0,0,0,0.4);
            text-align: center;
            width: 90%;
            max-width: 500px;
            backdrop-filter: blur(16px);
        }

        h1 {
            font-size: 3rem;
            font-weight: 200;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #ffffff, #c0c0ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            margin: 16px 0 32px;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        .google-btn {
            padding: 16px 50px;
            font-size: 1.2rem;
            background: transparent;
            border: 1.5px solid #6a4fff;
            border-radius: 999px;
            color: #d0c0ff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0 auto;
            transition: all 0.4s ease;
        }

        .google-btn:hover {
            background: rgba(106, 79, 255, 0.1);
            box-shadow: 0 0 35px rgba(106, 79, 255, 0.3);
            transform: translateY(-3px);
            border-color: #8a6fff;
        }

        #error {
            color: #ff6b6b;
            margin-top: 20px;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .loader {
            display: none;
            margin: 20px auto;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #6a4fff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>

    <div class="arc-lines">
        <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <path d="M 720 420 Q 300 300 -100 600" stroke="rgba(180,200,255,0.08)" stroke-width="1" fill="none"/>
            <path d="M 720 420 Q 1100 280 1600 580" stroke="rgba(180,200,255,0.07)" stroke-width="1" fill="none"/>
            <path d="M 720 420 Q 400 350 100 750" stroke="rgba(180,200,255,0.05)" stroke-width="1" fill="none"/>
            <path d="M 720 420 Q 1050 340 1400 720" stroke="rgba(180,200,255,0.05)" stroke-width="1" fill="none"/>
            <circle cx="692" cy="265" r="2" fill="rgba(200,220,255,0.6)"/>
        </svg>
    </div>

    <div class="grid-floor">
        <svg viewBox="0 0 1440 500" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="fadeUp" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="black" stop-opacity="1"/>
                    <stop offset="40%" stop-color="black" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="gridColor" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="rgba(100,120,200,0)" />
                    <stop offset="60%" stop-color="rgba(100,130,220,0.35)" />
                    <stop offset="100%" stop-color="rgba(80,100,200,0.5)" />
                </linearGradient>
                <mask id="gridMask">
                    <rect width="1440" height="500" fill="white"/>
                    <rect width="1440" height="500" fill="url(#fadeUp)"/>
                </mask>
            </defs>
            <g mask="url(#gridMask)">
                <line x1="720" y1="0" x2="-300" y2="500" stroke="url(#gridColor)" stroke-width="0.7" opacity="0.7"/>
                <line x1="720" y1="0" x2="-100" y2="500" stroke="url(#gridColor)" stroke-width="0.7" opacity="0.7"/>
                <line x1="720" y1="0" x2="100" y2="500" stroke="url(#gridColor)" stroke-width="0.7" opacity="0.7"/>
                <line x1="720" y1="0" x2="300" y2="500" stroke="url(#gridColor)" stroke-width="0.7" opacity="0.7"/>
                <line x1="720" y1="0" x2="500" y2="500" stroke="url(#gridColor)" stroke-width="0.7" opacity="0.7"/>
                <line x1="720" y1="0" x2="620" y2="500" stroke="url(#gridColor)" stroke-width="0.7" opacity="0.7"/>
                <line x1="720" y1="0" x2="720" y2="500" stroke="url(#gridColor)" stroke-width="0.8" opacity="0.9"/>
                <line x1="720" y1="0" x2="820" y2="500" stroke="url(#gridColor)" stroke-width="0.7" opacity="0.7"/>
                <line x1="720" y1="0" x2="940" y2="500" stroke="url(#gridColor)" stroke-width="0.7" opacity="0.7"/>
                <line x1="720" y1="0" x2="1140" y2="500" stroke="url(#gridColor)" stroke-width="0.7" opacity="0.7"/>
                <line x1="720" y1="0" x2="1340" y2="500" stroke="url(#gridColor)" stroke-width="0.7" opacity="0.7"/>
                <line x1="720" y1="0" x2="1540" y2="500" stroke="url(#gridColor)" stroke-width="0.7" opacity="0.7"/>
                <line x1="720" y1="0" x2="1740" y2="500" stroke="url(#gridColor)" stroke-width="0.7" opacity="0.7"/>
                <line x1="0" y1="500" x2="1440" y2="500" stroke="rgba(100,130,220,0.5)" stroke-width="0.8"/>
                <line x1="130" y1="440" x2="1310" y2="440" stroke="rgba(100,130,220,0.4)" stroke-width="0.7"/>
                <line x1="250" y1="390" x2="1190" y2="390" stroke="rgba(100,130,220,0.35)" stroke-width="0.6"/>
                <line x1="360" y1="345" x2="1080" y2="345" stroke="rgba(100,130,220,0.3)" stroke-width="0.6"/>
                <line x1="450" y1="305" x2="990" y2="305" stroke="rgba(100,130,220,0.25)" stroke-width="0.5"/>
                <line x1="530" y1="268" x2="910" y2="268" stroke="rgba(100,130,220,0.2)" stroke-width="0.5"/>
                <line x1="595" y1="235" x2="845" y2="235" stroke="rgba(100,130,220,0.15)" stroke-width="0.4"/>
                <line x1="645" y1="205" x2="795" y2="205" stroke="rgba(100,130,220,0.1)" stroke-width="0.4"/>
                <line x1="685" y1="175" x2="755" y2="175" stroke="rgba(100,130,220,0.08)" stroke-width="0.3"/>
            </g>
        </svg>
    </div>

    <div class="box">
        <h1>Pulsar AI</h1>
        <p>One-click with Google</p>

        <button class="google-btn" onclick="googleSignIn()">
            Sign in with Google
        </button>

        <div class="loader" id="loader"></div>
        <div id="error"></div>
    </div>

    <script>
        // Star field
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 220; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 0.15 + Math.random() * 0.35;
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.72,
                    r: 0.3 + Math.random() * 1.1,
                    alpha: 0.3 + Math.random() * 0.6,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed * 0.4,
                    twinkleSpeed: 0.0003 + Math.random() * 0.0008,
                    twinkleOffset: Math.random() * Math.PI * 2,
                });
            }
        }

        function animate(t) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const s of stars) {
                s.x += s.vx;
                s.y += s.vy;
                if (s.x < 0) s.x = canvas.width;
                if (s.x > canvas.width) s.x = 0;
                if (s.y < 0) s.y = canvas.height * 0.72;
                if (s.y > canvas.height * 0.72) s.y = 0;
                const twinkle = Math.sin(t * s.twinkleSpeed * 60 + s.twinkleOffset);
                const alpha = s.alpha * (0.85 + 0.15 * twinkle);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 215, 255, ${alpha})`;
                ctx.fill();
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(animate);

        // Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCl5vqdz3IW9FOi9BSr7ri1Yp6zbhYccSY",
            authDomain: "pulsar-demo-afd85.firebaseapp.com",
            projectId: "pulsar-demo-afd85",
            storageBucket: "pulsar-demo-afd85.firebasestorage.app",
            messagingSenderId: "990326872543",
            appId: "1:990326872543:web:56920e7cdeb33f3b1acc6a",
            measurementId: "G-ECRP2SE1R4"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function googleSignIn() {
            document.getElementById("loader").style.display = "block";
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(() => {
                    window.location.href = 'chat.html';
                })
                .catch(err => {
                    document.getElementById("loader").style.display = "none";
                    document.getElementById("error").textContent = "Google said nah: " + err.message;
                });
        }

        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'chat.html';
        });
    </script>
</body>
</html>
