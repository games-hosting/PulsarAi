<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulsar Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #08080f;
            --surface: #0e0e1a;
            --surface2: #13131f;
            --border: rgba(106,79,255,0.15);
            --border-hover: rgba(106,79,255,0.35);
            --accent: #6a4fff;
            --accent-soft: rgba(106,79,255,0.12);
            --text: #e8e8f0;
            --text-muted: rgba(232,232,240,0.45);
            --text-dim: rgba(232,232,240,0.22);
            --red: rgba(255,80,80,0.85);
            --green: rgba(80,220,120,0.85);
            --gold: rgba(245,158,11,0.9);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        /* ── AUTH GUARD ── */
        #auth-guard {
            position: fixed; inset: 0;
            background: var(--bg);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        #auth-guard .denied {
            color: var(--red);
            font-size: 1rem;
            display: none;
        }

        /* ── TOPBAR ── */
        .topbar {
            height: 56px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: rgba(8,8,15,0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .admin-logo {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, #c0c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-badge {
            background: rgba(255,80,80,0.12);
            border: 1px solid rgba(255,80,80,0.3);
            color: #ff8080;
            font-size: 0.68rem;
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 7px;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
        }
        .topbar-btn:hover { border-color: var(--border-hover); color: var(--text); }

        .admin-user {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* ── LAYOUT ── */
        .page {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: calc(100vh - 56px);
        }

        /* ── USER LIST ── */
        .user-panel {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 16px 18px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
        }

        .user-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 999px;
        }

        .search-wrap {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
        }

        .search-input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.83rem;
            padding: 8px 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--border-hover); }
        .search-input::placeholder { color: var(--text-dim); }

        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .user-item {
            padding: 11px 12px;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
            margin-bottom: 3px;
        }
        .user-item:hover { background: var(--surface2); }
        .user-item.active {
            background: var(--accent-soft);
            border-color: var(--border);
        }

        .user-item-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .user-email {
            font-size: 0.82rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .plan-pill {
            font-size: 0.65rem;
            padding: 2px 7px;
            border-radius: 999px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .plan-free { background: rgba(100,200,100,0.1); color: #80d080; border: 1px solid rgba(100,200,100,0.2); }
        .plan-pro { background: var(--accent-soft); color: #c0b0ff; border: 1px solid rgba(106,79,255,0.3); }
        .plan-nova { background: linear-gradient(90deg, rgba(168,85,247,0.15), rgba(245,158,11,0.1)); color: #e0b0ff; border: 1px solid rgba(168,85,247,0.3); }

        .user-item-meta {
            font-size: 0.72rem;
            color: var(--text-dim);
        }

        /* ── DETAIL PANEL ── */
        .detail-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .detail-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-dim);
            font-size: 0.88rem;
        }

        .detail-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
            display: none;
        }
        .detail-content.visible { display: block; }

        .detail-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 16px;
        }

        .detail-user-info h2 {
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 4px;
        }

        .detail-user-info .uid {
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-dim);
        }

        .plan-changer {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .plan-changer label {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .plan-select {
            background: var(--surface2);
            border: 1px solid var(--border-hover);
            color: var(--text);
            padding: 7px 12px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            outline: none;
            cursor: pointer;
        }
        .plan-select option { background: #13131f; }

        .save-plan-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 7px 16px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .save-plan-btn:hover { background: #7a5fff; }

        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 14px 16px;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        /* Chats section */
        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-bottom: 12px;
        }

        .chat-rows {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-row {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .chat-row-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .chat-row-header:hover { background: rgba(106,79,255,0.05); }

        .chat-row-title {
            font-size: 0.86rem;
            color: var(--text);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 12px;
        }

        .chat-row-meta {
            font-size: 0.72rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .chat-expand-icon {
            font-size: 0.7rem;
            color: var(--text-dim);
            transition: transform 0.2s;
        }
        .chat-row.open .chat-expand-icon { transform: rotate(180deg); }

        .chat-messages {
            display: none;
            border-top: 1px solid var(--border);
            padding: 14px;
            gap: 10px;
            flex-direction: column;
            max-height: 400px;
            overflow-y: auto;
        }
        .chat-row.open .chat-messages { display: flex; }

        .msg-row {
            display: flex;
            gap: 10px;
            font-size: 0.83rem;
            line-height: 1.6;
        }

        .msg-role {
            font-size: 0.68rem;
            font-weight: 500;
            padding: 2px 7px;
            border-radius: 4px;
            flex-shrink: 0;
            height: fit-content;
            margin-top: 2px;
            font-family: 'DM Mono', monospace;
        }
        .msg-role.user { background: var(--accent-soft); color: #c0b0ff; }
        .msg-role.assistant { background: rgba(80,220,120,0.1); color: #80d080; }

        .msg-text {
            color: var(--text-muted);
            flex: 1;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .loading-spinner {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dim);
            font-size: 0.85rem;
            padding: 20px 0;
        }

        .spinner {
            width: 18px; height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--surface2);
            border: 1px solid var(--border-hover);
            color: var(--text);
            padding: 9px 18px;
            border-radius: 999px;
            font-size: 0.83rem;
            z-index: 999;
            opacity: 0;
            transition: all 0.25s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body>

<div id="auth-guard">
    <div style="font-size:1.5rem;letter-spacing:-1px;background:linear-gradient(90deg,#fff,#c0c0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Pulsar Admin</div>
    <div>Checking access…</div>
    <div class="denied" id="denied-msg">⛔ Access denied. Admins only.</div>
</div>

<div class="topbar">
    <div class="topbar-left">
        <span class="admin-logo">Pulsar AI</span>
        <span class="admin-badge">Admin</span>
    </div>
    <div class="topbar-right">
        <span class="admin-user" id="admin-email"></span>
        <button class="topbar-btn" onclick="window.location.href='chat.html'">← Back to Chat</button>
        <button class="topbar-btn" onclick="auth.signOut().then(()=>location.href='login.html')">Sign out</button>
    </div>
</div>

<div class="page">
    <!-- User list -->
    <div class="user-panel">
        <div class="panel-header">
            <span class="panel-title">Users</span>
            <span class="user-count" id="user-count">—</span>
        </div>
        <div class="search-wrap">
            <input type="text" class="search-input" id="search-input" placeholder="Search by email…" oninput="filterUsers()">
        </div>
        <div class="user-list" id="user-list">
            <div class="loading-spinner"><div class="spinner"></div> Loading users…</div>
        </div>
    </div>

    <!-- Detail panel -->
    <div class="detail-panel">
        <div class="detail-empty" id="detail-empty">
            <div style="font-size:2rem;opacity:0.3">👤</div>
            <div>Select a user to view their data</div>
        </div>
        <div class="detail-content" id="detail-content">
            <div class="detail-header">
                <div class="detail-user-info">
                    <h2 id="detail-email">—</h2>
                    <div class="uid" id="detail-uid">—</div>
                </div>
                <div class="plan-changer">
                    <label>Plan:</label>
                    <select class="plan-select" id="plan-select">
                        <option value="free">Free</option>
                        <option value="pro">Pro</option>
                        <option value="nova">Nova</option>
                    </select>
                    <button class="save-plan-btn" onclick="savePlan()">Save</button>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-label">Total Chats</div>
                    <div class="stat-value" id="stat-chats">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Messages</div>
                    <div class="stat-value" id="stat-messages">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Messages This Window</div>
                    <div class="stat-value" id="stat-window">—</div>
                </div>
            </div>

            <div class="section-title">Conversations</div>
            <div class="chat-rows" id="chat-rows">
                <div class="loading-spinner"><div class="spinner"></div> Loading chats…</div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ADMIN_EMAIL = "theodor.rozitis@edu.esn.se";

const firebaseConfig = {
    apiKey: "AIzaSyCl5vqdz3IW9FOi9BSr7ri1Yp6zbhYccSY",
    authDomain: "pulsar-demo-afd85.firebaseapp.com",
    projectId: "pulsar-demo-afd85",
    storageBucket: "pulsar-demo-afd85.firebasestorage.app",
    messagingSenderId: "990326872543",
    appId: "1:990326872543:web:56920e7cdeb33f3b1acc6a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let allUsers = [];
let selectedUserId = null;

// ── AUTH ─────────────────────────────────────────────
auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = 'login.html'; return; }
    if (user.email !== ADMIN_EMAIL) {
        document.getElementById('denied-msg').style.display = 'block';
        document.querySelector('#auth-guard div:nth-child(2)').style.display = 'none';
        setTimeout(() => window.location.href = 'chat.html', 2500);
        return;
    }
    document.getElementById('auth-guard').style.display = 'none';
    document.getElementById('admin-email').textContent = user.email;
    loadAllUsers();
});

// ── LOAD USERS ────────────────────────────────────────
async function loadAllUsers() {
    try {
        const snap = await db.collection('users').get();
        allUsers = [];

        for (const doc of snap.docs) {
            const uid = doc.id;
            // Get plan from meta subcollection
            let plan = 'free';
            let msgCount = 0;
            try {
                const profile = await db.collection('users').doc(uid).collection('meta').doc('profile').get();
                if (profile.exists) plan = profile.data().plan || 'free';
                const rl = await db.collection('users').doc(uid).collection('meta').doc('ratelimit').get();
                if (rl.exists) msgCount = rl.data().messageCount || 0;
            } catch(e) {}

            // Get chat count
            let chatCount = 0;
            try {
                const chats = await db.collection('users').doc(uid).collection('chats').get();
                chatCount = chats.size;
            } catch(e) {}

            allUsers.push({ uid, plan, msgCount, chatCount, email: uid });
        }

        // Try to get email from auth — we can only show uid unless stored
        document.getElementById('user-count').textContent = allUsers.length;
        renderUserList(allUsers);
    } catch(e) {
        document.getElementById('user-list').innerHTML = `<div style="padding:16px;font-size:0.82rem;color:var(--red)">Error loading users: ${e.message}</div>`;
    }
}

function renderUserList(users) {
    const list = document.getElementById('user-list');
    if (users.length === 0) {
        list.innerHTML = '<div style="padding:16px;font-size:0.82rem;color:var(--text-dim)">No users found</div>';
        return;
    }
    list.innerHTML = '';
    users.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user-item' + (u.uid === selectedUserId ? ' active' : '');
        div.onclick = () => selectUser(u.uid);

        const planClass = u.plan === 'nova' ? 'plan-nova' : u.plan === 'pro' ? 'plan-pro' : 'plan-free';
        const planLabel = u.plan.charAt(0).toUpperCase() + u.plan.slice(1);

        div.innerHTML = `
            <div class="user-item-top">
                <span class="user-email" title="${u.uid}">${u.storedEmail || truncateUid(u.uid)}</span>
                <span class="plan-pill ${planClass}">${planLabel}</span>
            </div>
            <div class="user-item-meta">${u.chatCount} chat${u.chatCount !== 1 ? 's' : ''} · ${u.msgCount} msgs this window</div>
        `;
        list.appendChild(div);
    });
}

function truncateUid(uid) {
    return uid.length > 24 ? uid.slice(0, 10) + '…' + uid.slice(-6) : uid;
}

function filterUsers() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const filtered = allUsers.filter(u =>
        u.uid.toLowerCase().includes(q) ||
        (u.storedEmail || '').toLowerCase().includes(q)
    );
    renderUserList(filtered);
}

// ── SELECT USER ───────────────────────────────────────
async function selectUser(uid) {
    selectedUserId = uid;

    // Update active state in list
    document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.user-item').forEach(el => {
        if (el.querySelector('.user-email')?.title === uid) el.classList.add('active');
    });

    document.getElementById('detail-empty').style.display = 'none';
    const detail = document.getElementById('detail-content');
    detail.classList.add('visible');

    document.getElementById('detail-email').textContent = uid;
    document.getElementById('detail-uid').textContent = 'UID: ' + uid;

    // Load plan
    const user = allUsers.find(u => u.uid === uid);
    document.getElementById('plan-select').value = user?.plan || 'free';

    // Stats
    document.getElementById('stat-chats').textContent = user?.chatCount ?? '—';
    document.getElementById('stat-window').textContent = user?.msgCount ?? '—';

    // Load chats
    const chatRows = document.getElementById('chat-rows');
    chatRows.innerHTML = '<div class="loading-spinner"><div class="spinner"></div> Loading…</div>';

    try {
        const snap = await db.collection('users').doc(uid).collection('chats').get();
        const chats = [];
        snap.forEach(doc => chats.push({ id: doc.id, ...doc.data() }));
        chats.sort((a,b) => (b.updatedAt?.toMillis?.() || 0) - (a.updatedAt?.toMillis?.() || 0));

        // Count total messages
        let totalMsgs = 0;
        chats.forEach(c => { totalMsgs += (c.messages || []).filter(m => m.role !== 'system').length; });
        document.getElementById('stat-messages').textContent = totalMsgs;

        if (chats.length === 0) {
            chatRows.innerHTML = '<div style="font-size:0.83rem;color:var(--text-dim);padding:8px 0">No chats yet</div>';
            return;
        }

        chatRows.innerHTML = '';
        chats.forEach(chat => {
            const msgs = (chat.messages || []).filter(m => m.role !== 'system');
            const row = document.createElement('div');
            row.className = 'chat-row';

            const updatedAt = chat.updatedAt?.toDate?.()?.toLocaleDateString() || '—';

            row.innerHTML = `
                <div class="chat-row-header" onclick="toggleChat(this)">
                    <span class="chat-row-title">${escapeHtml(chat.title || 'Untitled')}</span>
                    <div class="chat-row-meta">
                        <span>${msgs.length} msgs</span>
                        <span>${updatedAt}</span>
                        <span class="chat-expand-icon">▾</span>
                    </div>
                </div>
                <div class="chat-messages">
                    ${msgs.map(m => `
                        <div class="msg-row">
                            <span class="msg-role ${m.role}">${m.role}</span>
                            <span class="msg-text">${escapeHtml(m.content || '')}</span>
                        </div>
                    `).join('')}
                </div>
            `;
            chatRows.appendChild(row);
        });
    } catch(e) {
        chatRows.innerHTML = `<div style="font-size:0.82rem;color:var(--red)">Error: ${e.message}</div>`;
    }
}

function toggleChat(header) {
    const row = header.closest('.chat-row');
    row.classList.toggle('open');
}

// ── SAVE PLAN ─────────────────────────────────────────
async function savePlan() {
    if (!selectedUserId) return;
    const plan = document.getElementById('plan-select').value;
    try {
        await db.collection('users').doc(selectedUserId)
                .collection('meta').doc('profile')
                .set({ plan }, { merge: true });

        // Update local cache
        const user = allUsers.find(u => u.uid === selectedUserId);
        if (user) user.plan = plan;
        renderUserList(allUsers);
        showToast(`Plan updated to ${plan} ✓`);
    } catch(e) {
        showToast('Error saving plan: ' + e.message);
    }
}

// ── HELPERS ───────────────────────────────────────────
function escapeHtml(str) {
    return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
