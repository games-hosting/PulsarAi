<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulsar AI</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            height: 100vh;
            background: #000;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Deep space bg with subtle starry glow */
        .space {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 15% 25%, rgba(80,70,140,0.04) 0%, transparent 40%),
                        radial-gradient(circle at 85% 75%, rgba(100,80,160,0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        /* Subtle grid floor with depth */
        .floor {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 70%;
            background: linear-gradient(to bottom, transparent 30%, #0a0a0a 100%),
                        repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(40,40,60,0.08) 2px, rgba(40,40,60,0.08) 4px);
            transform: perspective(1200px) rotateX(65deg);
            transform-origin: bottom;
            opacity: 0.35;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 6rem;
            font-weight: 200;
            letter-spacing: -4px;
            background: linear-gradient(90deg, #ffffff, #c0c0ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            animation: soft-pulse 10s ease-in-out infinite;
        }

        .tagline {
            font-size: 1.8rem;
            opacity: 0.75;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        .btn {
            padding: 18px 70px;
            font-size: 1.5rem;
            background: transparent;
            border: 1.5px solid #6a4fff;
            border-radius: 999px;
            color: #d0c0ff;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: rgba(106,79,255,0.08);
            box-shadow: 0 0 35px rgba(106,79,255,0.3);
            transform: translateY(-5px);
            border-color: #8a6fff;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: radial-gradient(circle at 50% 50%, rgba(106,79,255,0.12), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
        }

        .btn:hover::before {
            opacity: 1;
        }

        @keyframes soft-pulse {
            0%, 100% { opacity: 0.95; text-shadow: 0 0 25px rgba(106,79,255,0.15); }
            50% { opacity: 1; text-shadow: 0 0 45px rgba(106,79,255,0.3); }
        }

        /* Tiny purple cursor line */
        .cursor-glow {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 1px;
            height: 180px;
            background: linear-gradient(to bottom, transparent, #7a5cff, transparent);
            transform: translate(-50%, -50%);
            animation: line-breathe 6s infinite;
            opacity: 0.25;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes line-breathe {
            0%, 100% { height: 180px; opacity: 0.25; }
            50% { height: 240px; opacity: 0.45; }
        }
    </style>
</head>
<body>
    <div class="space"></div>
    <div class="floor"></div>
    <div class="cursor-glow"></div>

    <div class="content">
        <h1>Pulsar AI</h1>
        <div class="tagline">Intelligent, Fast, Reliable</div>
        <button class="btn" onclick="window.location.href='login.html'">Get Started</button>
    </div>
</body>
</html>
