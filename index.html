<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aesthetic.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            background: #000;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Subtle starry glow background */
        .stars {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(100, 100, 255, 0.03) 0%, transparent 20%),
                        radial-gradient(circle at 80% 70%, rgba(120, 100, 200, 0.02) 0%, transparent 25%);
            pointer-events: none;
            z-index: 1;
        }

        /* Cool grid floor */
        .grid {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 60%;
            background: 
                linear-gradient(to right, rgba(40, 40, 60, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(40, 40, 60, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(1000px) rotateX(60deg);
            transform-origin: bottom;
            opacity: 0.4;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 5.5rem;
            font-weight: 300;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #ffffff, #d0d0ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: subtle-glow 8s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1.6rem;
            margin: 20px 0 40px;
            opacity: 0.7;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .btn {
            padding: 16px 60px;
            font-size: 1.4rem;
            background: transparent;
            border: 2px solid #7a5cff;
            border-radius: 50px;
            color: #d0d0ff;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: rgba(122, 92, 255, 0.1);
            box-shadow: 0 0 30px rgba(122, 92, 255, 0.4);
            transform: translateY(-4px);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            background: radial-gradient(circle, #7a5cff 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
            opacity: 0;
        }

        .btn:hover::after {
            width: 300px;
            height: 300px;
            opacity: 0.15;
        }

        @keyframes subtle-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(122, 92, 255, 0.2); }
            50% { text-shadow: 0 0 40px rgba(122, 92, 255, 0.4); }
        }

        /* Small purple cursor line */
        .cursor-line {
            position: absolute;
            width: 2px;
            height: 120px;
            background: linear-gradient(to bottom, transparent, #7a5cff, transparent);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            animation: pulse-line 4s infinite;
            opacity: 0.3;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes pulse-line {
            0%, 100% { height: 120px; opacity: 0.3; }
            50% { height: 180px; opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="grid"></div>
    <div class="cursor-line"></div>

    <div class="content">
        <h1>Welcome to aesthetic.</h1>
        <div class="subtitle">Start your unblocking journey today!</div>
        <button class="btn" onclick="window.location.href='login.html'">Get Started</button>
    </div>
</body>
</html>
